spring.application.name=biblioteca
spring.datasource.url=jdbc:h2:mem:usuariosdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
server.port=8081

# --- Seguridad: OAuth2 Resource Server (validacion de JWT emitidos por Keycloak) ---
# Spring usa este issuer-uri para descargar automaticamente las llaves publicas (JWK)
# de Keycloak y verificar la firma de cada token que llega en el header Authorization.
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8080/realms/biblioteca

# --- Swagger / OpenAPI ---
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.oauth.use-basic-authentication-with-access-code-grant=false
